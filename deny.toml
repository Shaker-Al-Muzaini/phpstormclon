[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Reassessed for dbtools connections: SQLx 0.8.6 uses RsaPublicKey encryption only, never RSA private-key decryption/signing. Remote connections require verified TLS; plaintext is explicit loopback only. Track upstream RUSTSEC-2023-0071 until a fixed rsa release is available." },
]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

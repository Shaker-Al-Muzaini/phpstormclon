[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "The advisory has no patched rsa release as of 2026-09-12. rsa is only transitive through sqlx-mysql in dbtools; no code in this workspace performs RSA private-key operations. Reassess when database connections are implemented." },
]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

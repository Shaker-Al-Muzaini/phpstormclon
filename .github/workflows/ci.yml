name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ============================================================
  # Rust: build, test, clippy, fmt
  # ============================================================
  rust:
    name: Rust 1.99.1 (Windows x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build
        run: cargo build --all

      - name: cargo test
        run: cargo test --all -- --test-threads=1

  # ============================================================
  # C++ / Qt: build and test
  # ============================================================
  cpp:
    name: C++ / Qt6 (Windows x64, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Qt 6.8
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Setup MSVC using Developer PowerShell
        shell: pwsh
        run: ./tools/msvc-env.ps1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1

      - name: Install clang-format
        run: python -m pip install clang-format==19.1.5

      - name: Check C++ formatting
        shell: pwsh
        run: |
          $sources = Get-ChildItem app,core,tests -Recurse -Include *.h,*.cpp | ForEach-Object { $_.FullName }
          clang-format --dry-run --Werror @sources

      - name: Configure vcpkg environment
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not configured on the Windows runner"
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          ./tools/ensure-vcpkg-baseline.ps1
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: cmake --preset windows-release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/windows-release --config Release

      - name: Test
        run: ctest --preset windows-release --output-on-failure

      - name: Deploy portable Windows build
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations build/windows-release/bin/ForgeIDE.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md build/windows-release/bin/
          Copy-Item docs/WINDOWS.md build/windows-release/bin/RUNNING.md
          Remove-Item build/windows-release/bin/forge*_tests.exe -ErrorAction SilentlyContinue

      - name: Upload portable Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ForgeIDE-windows-x64
          path: build/windows-release/bin/
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # License audit
  # ============================================================
  license-audit:
    name: License Audit (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run dependency policy checks
        run: cargo deny check
      - name: Run security audit
        run: cargo audit --ignore RUSTSEC-2023-0071
